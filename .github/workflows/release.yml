name: Publish to Plugin Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version."
            exit 1
          fi

      # Every Lua file at the root is a command, and lib/ holds the shared code.
      # Editor files, docs, and scripts/ stay out of the signed bundle.
      - name: Stage plugin bundle
        run: |
          bundle="$RUNNER_TEMP/plugin-bundle"
          mkdir -p "$bundle/lib"
          cp manifest.json LICENSE ./*.lua "$bundle/"
          cp lib/*.lua "$bundle/lib/"

      - uses: prusa3d/plugin-marketplace-publish@v1
        with:
          path: ${{ runner.temp }}/plugin-bundle
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
