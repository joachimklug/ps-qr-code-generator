name: Publish to Plugin Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Stage plugin bundle
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-bundle/lib"
          cp manifest.json LICENSE text_or_url.lua wlan.lua vcard.lua "$RUNNER_TEMP/plugin-bundle/"
          cp lib/qr_geometry.lua lib/qr_plate.lua lib/qrencode.lua lib/utils.lua "$RUNNER_TEMP/plugin-bundle/lib/"

      - uses: prusa3d/plugin-marketplace-publish@v1
        with:
          path: ${{ runner.temp }}/plugin-bundle
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
