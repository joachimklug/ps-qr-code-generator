name: Publish to Plugin Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version."
            exit 1
          fi

      # The bundle is flat: the command files and the shared lib_*.lua files sit at the root,
      # because Marketplace installs of bundles with a lib/ subfolder failed integrity checks.
      # Editor files, docs, and scripts/ stay out of the signed bundle.
      # LICENSE ships as LICENSE.txt: bundles may only contain allowed file types.
      - name: Stage plugin bundle
        run: |
          bundle="$RUNNER_TEMP/plugin-bundle"
          mkdir -p "$bundle"
          cp manifest.json ./*.lua "$bundle/"
          cp LICENSE "$bundle/LICENSE.txt"

      # Allowed file types from https://plugin-marketplace.prusa3d.com/docs/bundle
      - name: Check bundle file types
        run: |
          disallowed="$(find "$RUNNER_TEMP/plugin-bundle" -type f ! -name '*.lua' ! -name '*.json' ! -name '*.stl' ! -name '*.svg' ! -name '*.png' ! -name '*.md' ! -name '*.txt')"
          if [ -n "$disallowed" ]; then
            echo "::error::The bundle contains files the Marketplace does not allow:"
            echo "$disallowed"
            exit 1
          fi

      - uses: prusa3d/plugin-marketplace-publish@v1
        with:
          path: ${{ runner.temp }}/plugin-bundle
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
