name: Check

# Runs on branch pushes and pull requests. Tag pushes are skipped: the release workflow
# runs this check itself before publishing.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check Lua syntax
        run: luac5.4 -p ./*.lua scripts/*.lua

      - name: Check shared command params
        # Only the command files, not the shared lib_*.lua modules.
        run: lua5.4 scripts/check_shared_params.lua $(ls ./*.lua | grep -v '^./lib_')
