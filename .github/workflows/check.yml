name: Check

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check Lua syntax
        run: luac5.4 -p ./*.lua lib/*.lua scripts/*.lua

      - name: Check shared command params
        run: lua5.4 scripts/check_shared_params.lua ./*.lua
